# See README.md before activation: use Workers Free to prevent AI overage charges.
name = "srujay-agent"
main = "worker.js"
compatibility_date = "2026-09-30"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "https://srujayreddy.github.io"
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
WORKERS_AI_VIBE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_TIMEOUT_MS = "25000"
RATE_PER_MIN = "8"
RATE_PER_DAY = "800"
VIBE_PER_MIN = "4"
VIBE_PER_DAY = "200"

# Explicit opt-in only; retained provider secrets never change the selection.
MODEL = "claude-haiku-4-5"
GEMINI_MODEL = "gemini-2.5-flash-lite"
GEMINI_VIBE_MODEL = "gemini-2.5-flash"

[[kv_namespaces]]
binding = "RATE_KV"
id = "1733836f651b48eab926245d3293f58e"
